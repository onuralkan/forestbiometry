# Push to main → run the numerical tests, the browser tests and the R-code check → upload changed files to forestbiometry.online through the cPanel API
# over HTTPS (port 2083). Script: .github/deploy-cpanel.sh. Nothing on the server is deleted; the upload stops
# unless DIR already holds this site (inc/site.php) or is an empty cPanel document root.
# Only repository secret: CPANEL_TOKEN (API token of the forestbiometry.online cPanel account).
# Server, account and folder are written below (not secret). If any of them is emptied, nothing is uploaded.
name: Deploy to forestbiometry.online
on:
  push:
    branches: [main]
    # Pushes that change only documents do not test or upload anything (21 Nov 2026, user decision): docs/ and the Markdown
    # files are not uploaded to the server. METHODS.md and DIST_SPEC.md stay included because tests/dist/test_p15.mjs reads them;
    # docs/kaynakca.json because inc/kaynakca.json is built from it (scripts/kaynakca.mjs --check).
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'docs/METHODS.md'
      - 'docs/DIST_SPEC.md'
      - 'docs/kaynakca.json'
  workflow_dispatch: {}
concurrency:
  group: deploy
  cancel-in-progress: false
env:
  CP_HOST: fr-collins.guzelhosting.com   # cPanel server (164.132.247.15; valid certificate on 2083)
  CP_USER: forestbi                      # cPanel account
  DIR: /home/forestbi/public_html        # document root of forestbiometry.online (main domain of the account)
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Page bundles are up to date (assets/build from assets/lab; scripts/bundle.mjs)
        run: |
          npm install --no-save --no-package-lock acorn@8.18.0
          node scripts/bundle.mjs --check
      - name: Numerical tests
        run: |
          node scripts/kaynakca.mjs --check
          node legacy/test_math.js
          node tests/checker/test_checker.mjs
          node tests/stand/test_stand.mjs
          node tests/eval/test_eval.mjs
          node tests/weibull/test_weibull.mjs
          node tests/rank/test_rank.mjs
          node tests/hd/test_hd.mjs
          node tests/sampling/test_sampling.mjs
          node tests/site/test_cite.mjs
          node tests/site/test_guide.mjs
          node tests/site/test_format.mjs
          node tests/core/test_t01.mjs
          node tests/secvol/test_sv01.mjs
          node tests/secvol/test_sv03.mjs
          node tests/secvol/test_sv_fix.mjs
          node tests/siteindex/test_si01.mjs
          node tests/siteindex/test_si03.mjs
          node tests/siteindex/test_si04.mjs
          node tests/siteindex/test_si_classes.mjs
          node tests/structure/test_ss01.mjs
          node tests/structure/test_ss02.mjs
          node tests/structure/test_ss02_r.mjs
          node tests/taper/test_tp01.mjs
          node tests/taper/test_sv02a2.mjs
          node tests/taper/test_sv02a3.mjs
          node tests/taper/test_sv06.mjs
          node tests/taper/test_sv03.mjs
          node tests/volume/test_sv04.mjs
          node tests/logscale/test_sv05.mjs
          node tests/nlsreg/test_sm02.mjs
          node tests/mixed/test_sm03.mjs
          node tests/eqsys/test_sm04.mjs
          node tests/tree/test_tm01.mjs
          node tests/tree/test_tm02_06.mjs
          node tests/tree/test_tm05.mjs
          node tests/tree/test_tm03.mjs
          node tests/tree/test_tm04.mjs
          node tests/coeflib/test_di02.mjs
          node tests/record/test_di07.mjs
          node tests/library/test_view.mjs
          node tests/projects/test_di03.mjs
          node tests/dashboard/test_di04.mjs
          node tests/report/test_di05.mjs
          node tests/biomass/test_bc01.mjs
          node tests/biomass/test_bc02.mjs
          node tests/biomass/test_bc03.mjs
          node tests/biomass/test_bc04.mjs
          node tests/biomass/test_bc02s.mjs
          node tests/biomass/test_bc02n.mjs
          node tests/growth/test_sq03.mjs
          node tests/structure/test_ss07.mjs
          node tests/structure/test_ss04.mjs
          node tests/structure/test_ccf.mjs
          node tests/dist/test_p01.mjs
          node tests/dist/test_p05.mjs
          node tests/dist/test_p06.mjs
          node tests/dist/test_p07.mjs
          node tests/dist/test_export.mjs
          node tests/dist/test_p02.mjs
          node tests/dist/test_p03.mjs
          node tests/dist/test_p04.mjs
          node tests/dist/test_p08.mjs
          node tests/dist/test_p09.mjs
          node tests/dist/test_p10.mjs
          node tests/dist/test_p11.mjs
          node tests/dist/test_p12.mjs
          node tests/dist/test_p13.mjs
          node tests/dist/test_p14.mjs
          node tests/dist/test_p15.mjs
          node tests/dist/test_p16.mjs
          node tests/dist/test_p17.mjs
          node tests/dist/test_p18.mjs
          node tests/dist/test_p19.mjs
          node tests/dist/test_p20.mjs
          node tests/dist/test_p23.mjs
          node tests/dist/test_p24.mjs
  browser:
    # Every browser test (tests/*/e2e*.mjs, scripts/e2e.sh) against the PHP built-in server: first with the bundled
    # files the server gets (FB_BUNDLE=1), then with the module sources. Nothing is uploaded unless both pass.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # PHP 8.3 as on the server (the runner image's own PHP, 8.5 in Nov 2026, answers 200 for missing files on the
      # built-in server, where the site's test expects 404 for the removed pages of the old site)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP version
        run: php -v
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser tests, bundled files (as on the server)
        run: |
          PHP_CLI_SERVER_WORKERS=4 FB_BUNDLE=1 php -S 127.0.0.1:8092 > /tmp/php-bundled.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8092/ && break; sleep 1; done
          scripts/e2e.sh http://127.0.0.1:8092 4
      - name: Browser tests, module sources
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8093 > /tmp/php-sources.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8093/ && break; sleep 1; done
          scripts/e2e.sh http://127.0.0.1:8093 4
  rcode:
    # The "R code" scripts of the model tools (tests/rcode/, scripts/rcode-check.sh): written for the tools' sample data,
    # run in R and compared with the tools' own numbers. Nothing is uploaded unless they agree.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: R from the Ubuntu archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends r-base-core r-cran-nlme r-cran-fitdistrplus r-cran-nleqslv
          Rscript -e 'cat(R.version.string, "\n")'
      - name: R code of the model tools gives the tools' numbers
        run: scripts/rcode-check.sh "$RUNNER_TEMP/rcode"
  deploy:
    needs: [test, browser, rcode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check configuration
        id: cfg
        env:
          HAS_TOKEN: ${{ secrets.CPANEL_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ] && [ -n "$CP_HOST" ] && [ -n "$CP_USER" ] && [ -n "$DIR" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Server details (CP_HOST, CP_USER, DIR) or the CPANEL_TOKEN secret are not set yet; skipping the upload."; fi
      - name: Upload through the cPanel API (HTTPS, port 2083)
        if: steps.cfg.outputs.ready == 'true'
        env:
          CP_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: bash .github/deploy-cpanel.sh
