# Push to main → run the numerical tests → upload changed files to forestbiometry.online through the cPanel API
# over HTTPS (port 2083). Script: .github/deploy-cpanel.sh. Nothing on the server is deleted; the upload stops
# unless DIR already holds this site (inc/site.php) or is an empty cPanel document root.
# Only repository secret: CPANEL_TOKEN (API token of the forestbiometry.online cPanel account).
# Server, account and folder are written below (not secret). If any of them is emptied, nothing is uploaded.
name: Deploy to forestbiometry.online
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: deploy
  cancel-in-progress: false
env:
  CP_HOST: fr-collins.guzelhosting.com   # cPanel server (164.132.247.15; valid certificate on 2083)
  CP_USER: forestbi                      # cPanel account
  DIR: /home/forestbi/public_html        # document root of forestbiometry.online (main domain of the account)
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Numerical tests
        run: |
          node legacy/test_math.js
          node tests/checker/test_checker.mjs
          node tests/stand/test_stand.mjs
          node tests/eval/test_eval.mjs
          node tests/weibull/test_weibull.mjs
          node tests/rank/test_rank.mjs
          node tests/hd/test_hd.mjs
          node tests/sampling/test_sampling.mjs
          node tests/site/test_cite.mjs
          node tests/site/test_guide.mjs
          node tests/site/test_format.mjs
          node tests/core/test_t01.mjs
          node tests/secvol/test_sv01.mjs
          node tests/secvol/test_sv03.mjs
          node tests/siteindex/test_si01.mjs
          node tests/siteindex/test_si03.mjs
          node tests/siteindex/test_si04.mjs
          node tests/dist/test_p01.mjs
          node tests/dist/test_p05.mjs
          node tests/dist/test_p06.mjs
          node tests/dist/test_p07.mjs
          node tests/dist/test_export.mjs
          node tests/dist/test_p02.mjs
          node tests/dist/test_p03.mjs
          node tests/dist/test_p04.mjs
          node tests/dist/test_p08.mjs
          node tests/dist/test_p09.mjs
          node tests/dist/test_p10.mjs
          node tests/dist/test_p11.mjs
          node tests/dist/test_p12.mjs
          node tests/dist/test_p13.mjs
          node tests/dist/test_p14.mjs
          node tests/dist/test_p15.mjs
          node tests/dist/test_p16.mjs
          node tests/dist/test_p17.mjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check configuration
        id: cfg
        env:
          HAS_TOKEN: ${{ secrets.CPANEL_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ] && [ -n "$CP_HOST" ] && [ -n "$CP_USER" ] && [ -n "$DIR" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Server details (CP_HOST, CP_USER, DIR) or the CPANEL_TOKEN secret are not set yet; skipping the upload."; fi
      - name: Upload through the cPanel API (HTTPS, port 2083)
        if: steps.cfg.outputs.ready == 'true'
        env:
          CP_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: bash .github/deploy-cpanel.sh
